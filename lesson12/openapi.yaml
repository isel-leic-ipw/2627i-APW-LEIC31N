openapi: 3.0.3
info:
  title: Shopping List API
  version: 1.0.0
  description: JSON API for managing shopping lists and their items.
servers:
  - url: /api
    description: Shopping List API base path
tags:
  - name: Lists
    description: Shopping lists and their items
paths:
  /lists:
    description: Collection of shopping lists. Use this resource to retrieve all lists or create a new list.
    get:
      tags: [Lists]
      operationId: getLists
      summary: Get all shopping lists
      description: Returns the shopping lists available to the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The shopping lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShoppingList'
        '401':
          $ref: '#/components/responses/AuthenticationError'
    post:
      tags: [Lists]
      operationId: createList
      summary: Create a shopping list
      description: Creates a new shopping list using the supplied list name.
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ListInput'
      responses:
        '201':
          description: The created shopping list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResult'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  '/lists/{listId}':
    description: A single shopping list identified by its ID, including its items.
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      tags: [Lists]
      operationId: getList
      summary: Get a shopping list and its items
      description: Retrieves one shopping list and the items it contains.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The requested shopping list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/ApiError'
    put:
      tags: [Lists]
      operationId: updateList
      summary: Update a shopping list
      description: Updates the name of the identified shopping list.
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ListInput'
      responses:
        '200':
          description: The updated shopping list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResult'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      tags: [Lists]
      operationId: deleteList
      summary: Delete a shopping list
      description: Deletes the identified shopping list.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ApiMessage'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/ApiError'
  '/lists/{listId}/items':
    description: Collection of items belonging to the identified shopping list.
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Lists]
      operationId: addItem
      summary: Add an item to a shopping list
      description: Adds a new item, with its name and quantity, to the identified shopping list.
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ItemInput'
      responses:
        '201':
          description: The created shopping-list item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResult'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/ApiError'
  '/lists/{listId}/items/{itemId}':
    description: A single item identified within a shopping list.
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/ItemId'
    delete:
      tags: [Lists]
      operationId: removeItem
      summary: Remove an item from a shopping list
      description: Removes the identified item from its shopping list.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ApiMessage'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/ApiError'
  '/lists/{listId}/items/{itemId}/toggle':
    description: Action resource for changing whether a shopping-list item is marked as bought.
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [Lists]
      operationId: toggleItem
      summary: Toggle an item's bought status
      description: Changes the item's bought status to its opposite value.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The updated shopping-list item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResult'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/ApiError'
components:
  schemas:
    ShoppingList:
      type: object
      required: [id, name, items]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Weekly groceries
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingItem'
    ShoppingItem:
      type: object
      required: [id, name, quantity, bought]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Apples
        quantity:
          type: integer
          minimum: 1
          example: 4
        bought:
          type: boolean
          example: false
    ListResult:
      type: object
      required: [list]
      properties:
        list:
          $ref: '#/components/schemas/ShoppingList'
    ItemResult:
      type: object
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/ShoppingItem'
    ApiMessage:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ApiError:
      type: object
      required: [message]
      properties:
        message:
          type: string
        description:
          type: string
  parameters:
    ListId:
      name: listId
      in: path
      required: true
      description: Shopping-list identifier
      schema:
        type: integer
    ItemId:
      name: itemId
      in: path
      required: true
      description: Item identifier
      schema:
        type: integer
  requestBodies:
    ListInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
    ItemInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, quantity]
            properties:
              name:
                type: string
                minLength: 1
              quantity:
                type: integer
                minimum: 1
  responses:
    ApiMessage:
      description: Operation result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiMessage'
    ApiError:
      description: The request could not be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthenticationError:
      description: Missing or invalid Bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token